services:
  - type: web
    name: team-6-fullstack-release
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: DATABASE_URL
        fromDatabase:
          name: team-6-fullstack-db
          property: connectionString
databases:
  - name: team-6-fullstack-db
    plan: free
    databaseName: team6
    user: team6
